[package]
name = "hermes-gateway-core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "../src/lib.rs"

[features]
default = []
test-support = []
voice-codec = ["dep:ogg", "dep:opus2"]
reliquary = ["dep:hermes-reliquary-plugin", "hermes-reliquary-plugin/native"]

[dependencies]
hermes-reliquary-plugin = { path = "../../plugins/reliquary", optional = true }
anyhow.workspace = true
hermes-engine = { path = "../../engine" }
hermes-library = { path = "../../library" }
hermes-telegram = { path = "../../telegram" }
async-channel.workspace = true
tokio = { workspace = true, features = ["net", "signal", "io-util"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
ogg = { version = "0.9.2", optional = true }
opus2 = { version = "0.4", optional = true }
base64 = "0.22"
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
scrypt = { version = "0.11", default-features = false }
serde_yaml = "0.9"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }
