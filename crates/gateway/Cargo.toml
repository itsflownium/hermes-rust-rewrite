[package]
name = "hermes-gateway"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/bundled.rs"

[features]
default = ["reliquary"]
reliquary = ["hermes-gateway-core/reliquary", "dep:hermes-reliquary-plugin"]

[dependencies]
anyhow.workspace = true
hermes-gateway-core = { path = "core" }
hermes-discord-plugin = { path = "../plugins/discord" }
hermes-telegram-plugin = { path = "../plugins/telegram" }
hermes-reliquary-plugin = { path = "../plugins/reliquary", optional = true }
tokio.workspace = true

[dev-dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hermes-engine = { path = "../engine" }
hermes-library = { path = "../library" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
serde_json = "1"
tempfile = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
