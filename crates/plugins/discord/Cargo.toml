[package]
name = "hermes-discord-plugin"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
hermes-engine = { path = "../../engine" }
hermes-gateway-core = { path = "../../gateway/core" }
ogg = "0.9.2"
opus2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "=0.6.1", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-channel.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hermes-gateway-core = { path = "../../gateway/core", features = ["test-support"] }
hermes-library = { path = "../../library" }
tempfile = "3"
