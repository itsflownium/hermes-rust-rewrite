[package]
name = "hermes-slack-plugin"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
hermes-engine = { path = "../../engine" }
hermes-gateway-core = { path = "../../gateway/core", features = ["voice-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
unicode-segmentation = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
hermes-gateway-core = { path = "../../gateway/core", features = ["test-support"] }
hermes-library = { path = "../../library" }
ring = "0.17"
tempfile = "3"
url = "2"
