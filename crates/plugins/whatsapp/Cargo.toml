[package]
name = "hermes-whatsapp-plugin"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64 = "0.22"
futures-util = "0.3"
hermes-engine = { path = "../../engine" }
hermes-gateway-core = { path = "../../gateway/core", features = ["voice-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
unicode-segmentation = "1"

[dev-dependencies]
axum = "0.8"
hermes-gateway-core = { path = "../../gateway/core", features = ["test-support"] }
ring = "0.17"
