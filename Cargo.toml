[workspace]
members = ["crates/engine", "crates/desktop", "crates/library", "crates/gateway", "crates/gateway/core", "crates/plugins/discord", "crates/plugins/telegram", "crates/plugins/slack", "crates/plugins/whatsapp", "crates/telegram", "crates/python-host", "crates/plugins/reliquary"]
default-members = ["crates/desktop"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
async-channel = "2"
tokio-util = "0.7"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

# Reliquary without its optional Lore project history, which Mercury does not use and which would
# bring in a QUIC and telemetry stack.
[patch."https://github.com/Lokee86/Reliquary.git"]
reliquary-project-environment = { path = "vendor/reliquary-project-environment" }

[patch.crates-io]
# GTK3 requires glib 0.18. This copy carries the upstream VariantStrIter fix.
glib = { git = "https://github.com/Lokee86/hermes-rust-rewrite.git", rev = "036f8720136dac1200992639b648b968623e6583" }
# Discord voice dependency backports. See vendor/DISCORD-VOICE-PATCHES.md.
davey = { path = "vendor/davey" }
openmls_basic_credential = { path = "vendor/openmls-basic-credential" }
openmls_rust_crypto = { path = "vendor/openmls-rust-crypto" }
songbird = { path = "vendor/songbird" }
